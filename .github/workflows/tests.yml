# Unit tests on every push/PR; UI tests opt-in via workflow_dispatch and a
# weekly scheduled sweep (Monday 05:23 UTC; see docs/TESTING.md).
#
# The repo's own runners (scripts/test_unit.sh, scripts/test_ui.sh) do the real
# work: they pin and boot a simulator, run a bounded preflight probe, and build
# into a dedicated .occlient/DerivedData (cached below). Public repo, so the
# macOS runners are free.
#
# Runner notes:
#   - The newest Xcode on the image is selected (the project carries
#     Xcode-26-era settings like XROS_DEPLOYMENT_TARGET and
#     SWIFT_APPROACHABLE_CONCURRENCY); the picked version is printed and
#     baked into the cache key so image drift invalidates cleanly.
#   - lib_simulator.sh uses GNU `timeout`, which stock macOS lacks; coreutils'
#     gnubin is prepended to PATH.
#   - `foundation-verify` runs on ubuntu-latest: the verifier self-test, then
#     `python3 scripts/verify.py --ci` (the Linux-safe categories; the macOS
#     unit/e2e/build categories report SKIP honestly and are never counted as
#     success). The macOS `unit-tests` job below remains the required app gate
#     (docs/STACKS.md rule): Linux-runnable checks alone never verify the app.
#   - `unit-tests-ipad` re-runs the same unit suite through
#     scripts/test_unit.sh with the documented OPENCODE_TEST_DESTINATION
#     override pinned to an available iPad simulator, so iPadOS layout/
#     behavior keeps coverage too. Non-required informational check.
#   - `visionos-build` compiles the shared scheme for the visionOS Simulator
#     with the README-documented xcodebuild command, closing the only target
#     with zero automated build coverage. Non-required informational check.

name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
  # Weekly non-manual UI-test sweep (Stage C item C3). The ui-tests job is
  # the only job gated to schedule + workflow_dispatch; every other job in
  # this file also runs on schedule pushes to the default branch, which is
  # an accepted weekly full sweep.
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Also run the UI test suite (slow on CI)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-verify:
    name: Foundation verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the verify gate
        run: python3 scripts/selftest_verify.py

      - name: Run foundation verify gate
        run: python3 scripts/verify.py --ci

  unit-tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Ensure GNU timeout for lib_simulator.sh preflight
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .occlient/DerivedData
          key: dd-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenCodeClient/OpenCodeClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            dd-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Run unit tests
        run: ./scripts/test_unit.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs-${{ github.run_id }}
          path: .occlient/DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore

  visionos-build:
    name: visionOS build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"

      # The README command uses a name-only destination, but runner images
      # can carry several visionOS runtimes (first CI run failed with
      # "multiple devices matched" for Apple Vision Pro on visionOS 2.5 and
      # 26.2). Resolve the newest Apple Vision Pro simulator and pin it by
      # UDID; the remaining flags are exactly the README command.
      - name: Resolve visionOS Simulator destination
        id: visionos
        run: |
          UDID="$(xcrun simctl list devices available | grep 'Apple Vision Pro' | grep -oE '[0-9A-F-]{36}' | tail -1 || true)"
          if [ -z "$UDID" ]; then
            echo "error: no Apple Vision Pro simulator available on this runner image" >&2
            xcrun simctl list devices available || true
            exit 1
          fi
          echo "using Apple Vision Pro simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .occlient/DerivedData
          key: dd-visionos-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenCodeClient/OpenCodeClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            dd-visionos-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-

      # The README-documented visionOS build command (README.md, "Building
      # from Source"), run from the repo root so the project path is stable.
      - name: Build for visionOS Simulator
        run: |
          xcodebuild -project "OpenCodeClient/OpenCodeClient.xcodeproj" \
            -scheme "OpenCodeClient" \
            -destination 'platform=visionOS Simulator,id=${{ steps.visionos.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO build

  unit-tests-ipad:
    name: Unit tests (iPad)
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Ensure GNU timeout for lib_simulator.sh preflight
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      # The runner image decides which iPad simulators exist; pin the newest
      # available one by UDID so the documented OPENCODE_TEST_DESTINATION
      # override keeps lib_simulator.sh's screenshot preflight working
      # (it extracts the UDID from `,id=`).
      #
      # The override branch also skips the script's in-script pin/boot, so
      # this step boots the device and waits for bootstatus before handing
      # over (first CI run failed the 15s preflight against a Shutdown
      # device). Last match = newest installed iPad runtime, matching the
      # newest Xcode selected above.
      #
      # Second CI run still failed the 15s probe even though bootstatus had
      # returned: freshly created iPad simulators can stay screenshot-
      # unresponsive for minutes after boot. Warm the device up here with a
      # bounded retry loop (job-local prep only); scripts/test_unit.sh's own
      # 15s probe remains the single fail-closed arbiter.
      - name: Pin, boot, and warm up an iPad simulator
        id: ipad
        run: |
          UDID="$(xcrun simctl list devices available | grep -E 'iPad' | grep -oE '[0-9A-F-]{36}' | tail -1 || true)"
          if [ -z "$UDID" ]; then
            echo "error: no available iPad simulator on this runner image" >&2
            xcrun simctl list devices available || true
            exit 1
          fi
          echo "pinning iPad simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          WARMED=0
          for attempt in 1 2 3 4 5 6 7 8; do
            PROBE_PNG="$(mktemp /tmp/ipad-probe.XXXXXXXX).png"
            if timeout 15 xcrun simctl io "$UDID" screenshot "$PROBE_PNG" >/dev/null 2>&1; then
              echo "iPad simulator screenshot-responsive (warm-up attempt $attempt)"
              WARMED=1
            fi
            rm -f "$PROBE_PNG"
            [ "$WARMED" = "1" ] && break
            echo "warm-up attempt $attempt: not yet responsive; waiting 20s"
            sleep 20
          done
          echo "warm-up finished responsive=$WARMED (test_unit.sh preflight decides final readiness)"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .occlient/DerivedData
          key: dd-ipad-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenCodeClient/OpenCodeClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            dd-ipad-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-

      # Same script as the required unit job; only the destination override
      # differs (scripts/test_unit.sh documents this env var).
      - name: Run unit tests on iPad destination
        env:
          OPENCODE_TEST_DESTINATION: 'platform=iOS Simulator,id=${{ steps.ipad.outputs.udid }}'
        run: ./scripts/test_unit.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-ipad-logs-${{ github.run_id }}
          path: .occlient/DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore

  ui-tests:
    name: UI tests (manual)
    runs-on: macos-15
    timeout-minutes: 90
    if: (github.event_name == 'workflow_dispatch' && inputs.run_ui_tests) || github.event_name == 'schedule'
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Ensure GNU timeout for lib_simulator.sh preflight
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .occlient/DerivedData
          key: dd-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenCodeClient/OpenCodeClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            dd-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Run UI tests
        run: ./scripts/test_ui.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs-${{ github.run_id }}
          path: .occlient/DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore
