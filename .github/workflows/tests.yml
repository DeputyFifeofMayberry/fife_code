# Unit tests on every push/PR; UI tests opt-in via workflow_dispatch.
#
# The repo's own runners (scripts/test_unit.sh, scripts/test_ui.sh) do the real
# work: they pin and boot a simulator, run a bounded preflight probe, and build
# into a dedicated .occlient/DerivedData (cached below). Public repo, so the
# macOS runners are free.
#
# Runner notes:
#   - The newest Xcode on the image is selected (the project carries
#     Xcode-26-era settings like XROS_DEPLOYMENT_TARGET and
#     SWIFT_APPROACHABLE_CONCURRENCY); the picked version is printed and
#     baked into the cache key so image drift invalidates cleanly.
#   - lib_simulator.sh uses GNU `timeout`, which stock macOS lacks; coreutils'
#     gnubin is prepended to PATH.
#   - `foundation-verify` runs on ubuntu-latest: the verifier self-test, then
#     `python3 scripts/verify.py --ci` (the Linux-safe categories; the macOS
#     unit/e2e/build categories report SKIP honestly and are never counted as
#     success). The macOS `unit-tests` job below remains the required app gate
#     (docs/STACKS.md rule): Linux-runnable checks alone never verify the app.
#   - `visionos-build` compiles the shared scheme for the visionOS Simulator
#     with the README-documented xcodebuild command, closing the only target
#     with zero automated build coverage. Non-required informational check.

name: Tests

on:
  push:
    branches: [master, dev]
  pull_request:
  workflow_dispatch:
    inputs:
      run_ui_tests:
        description: "Also run the UI test suite (slow on CI)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  foundation-verify:
    name: Foundation verify (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Self-test the verify gate
        run: python3 scripts/selftest_verify.py

      - name: Run foundation verify gate
        run: python3 scripts/verify.py --ci

  unit-tests:
    name: Unit tests
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Ensure GNU timeout for lib_simulator.sh preflight
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .occlient/DerivedData
          key: dd-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenCodeClient/OpenCodeClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            dd-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Run unit tests
        run: ./scripts/test_unit.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-logs-${{ github.run_id }}
          path: .occlient/DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore

  visionos-build:
    name: visionOS build
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"

      # The README command uses a name-only destination, but runner images
      # can carry several visionOS runtimes (first CI run failed with
      # "multiple devices matched" for Apple Vision Pro on visionOS 2.5 and
      # 26.2). Resolve the newest Apple Vision Pro simulator and pin it by
      # UDID; the remaining flags are exactly the README command.
      - name: Resolve visionOS Simulator destination
        id: visionos
        run: |
          UDID="$(xcrun simctl list devices available | grep 'Apple Vision Pro' | grep -oE '[0-9A-F-]{36}' | tail -1 || true)"
          if [ -z "$UDID" ]; then
            echo "error: no Apple Vision Pro simulator available on this runner image" >&2
            xcrun simctl list devices available || true
            exit 1
          fi
          echo "using Apple Vision Pro simulator $UDID"
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .occlient/DerivedData
          key: dd-visionos-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenCodeClient/OpenCodeClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            dd-visionos-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-

      # The README-documented visionOS build command (README.md, "Building
      # from Source"), run from the repo root so the project path is stable.
      - name: Build for visionOS Simulator
        run: |
          xcodebuild -project "OpenCodeClient/OpenCodeClient.xcodeproj" \
            -scheme "OpenCodeClient" \
            -destination 'platform=visionOS Simulator,id=${{ steps.visionos.outputs.udid }}' \
            CODE_SIGNING_ALLOWED=NO build

  ui-tests:
    name: UI tests (manual)
    runs-on: macos-15
    timeout-minutes: 90
    if: github.event_name == 'workflow_dispatch' && inputs.run_ui_tests
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        id: xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version
          echo "version=$(xcodebuild -version | awk 'NR==1{print $2}')" >> "$GITHUB_OUTPUT"

      - name: Ensure GNU timeout for lib_simulator.sh preflight
        run: |
          brew install coreutils
          echo "$(brew --prefix)/opt/coreutils/libexec/gnubin" >> "$GITHUB_PATH"

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: .occlient/DerivedData
          key: dd-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-${{ hashFiles('OpenCodeClient/OpenCodeClient.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: |
            dd-${{ runner.os }}-xcode${{ steps.xcode.outputs.version }}-

      - name: Run UI tests
        run: ./scripts/test_ui.sh

      - name: Upload test logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ui-test-logs-${{ github.run_id }}
          path: .occlient/DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore
