# Manual TestFlight release: archive, sign, export, and upload to
# App Store Connect. FifeCode (fork of OpenCodeClient) ships under the
# com.deputyfife.opencode bundle id.
#
# Required repo secrets:
#   APPLE_TEAM_ID              10-char team id (developer.apple.com membership page)
#   ASC_KEY_ID                 App Store Connect API key id
#   ASC_ISSUER_ID              API key issuer id
#   ASC_API_KEY_P8             base64 of the .p8 key file
#   DIST_CERT_P12              base64 of the Apple Distribution .p12
#   P12_PASSWORD               password set when the .p12 was exported
#   PROVISION_PROFILE_BASE64   base64 of the App Store profile for
#                              com.deputyfife.opencode
#
# Signing is manual (ephemeral runners cannot safely auto-create distribution
# certificates - the account caps them, and each run would mint a new one).
# CURRENT_PROJECT_VERSION is overridden with the run number so every upload
# has a unique build number without touching the project. The upload goes to
# TestFlight automatically (no release submission is created).

name: Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (CFBundleShortVersionString)"
        type: string
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Import distribution certificate
        env:
          CERT_BASE64: ${{ secrets.DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          echo -n "$CERT_BASE64" | base64 --decode -o "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          echo -n "$PROFILE_BASE64" | base64 --decode -o "$PP_PATH"
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          cp "$PP_PATH" "$PP_DIR/"
          UUID="$(security cms -D -i "$PP_PATH" | /usr/libexec/PlistBuddy -c 'Print UUID' /dev/stdin)"
          echo "profile UUID: $UUID"
          echo "PROFILE_UUID=$UUID" >> "$GITHUB_ENV"

      - name: Write App Store Connect API key
        env:
          P8_BASE64: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          echo -n "$P8_BASE64" | base64 --decode -o "$RUNNER_TEMP/AuthKey.p8"

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Xcode 26 renamed the App Store export method from app-store to
          # app-store-connect; pick the name the selected Xcode understands.
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR==1{print $2}' | cut -d. -f1)"
          if [ "$XCODE_MAJOR" -ge 26 ]; then
            METHOD="app-store-connect"
          else
            METHOD="app-store"
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$METHOD</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.deputyfife.opencode</key>
              <string>$PROFILE_UUID</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          xcodebuild archive \
            -project OpenCodeClient/OpenCodeClient.xcodeproj \
            -scheme OpenCodeClient \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FifeCode.xcarchive" \
            -derivedDataPath .occlient/DerivedData \
            -quiet \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_UUID" \
            MARKETING_VERSION="${MARKETING_VERSION:-1.0}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FifeCode.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -destination 'upload' \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}
          path: .occlient/DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore
