# Manual TestFlight release: archive, sign, export, and upload to
# App Store Connect. FifeCode (fork of OpenCodeClient) ships under the
# com.deputyfife.opencode bundle id.
#
# Required repo secrets:
#   APPLE_TEAM_ID              10-char team id (developer.apple.com membership page)
#   ASC_KEY_ID                 App Store Connect API key id
#   ASC_ISSUER_ID              API key issuer id
#   ASC_API_KEY_P8             base64 of the .p8 key file
#   DIST_CERT_P12              base64 of the Apple Distribution .p12
#   P12_PASSWORD               password set when the .p12 was exported
#   PROVISION_PROFILE_BASE64   base64 of the App Store profile for
#                              com.deputyfife.opencode
#
# Signing: the distribution certificate + private key are imported into a
# throwaway keychain (created once via portal CSR - never let CI mint new
# certs; accounts cap them). Archive and export then use Apple's automatic
# signing flow (-allowProvisioningUpdates + the ASC API key): xcodebuild
# matches the imported identity and resolves the profile from the account.
# CURRENT_PROJECT_VERSION is overridden with the run number so every upload
# has a unique build number without touching the project. The upload goes to
# TestFlight automatically (no release submission is created).

name: Release to TestFlight

on:
  workflow_dispatch:
    inputs:
      marketing_version:
        description: "Marketing version (CFBundleShortVersionString)"
        type: string
        default: "1.0"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Select newest Xcode
        run: |
          ls -d /Applications/Xcode*.app 2>/dev/null || true
          XCODE_APP="$(ls -d /Applications/Xcode*.app 2>/dev/null | sort -V | tail -1)"
          echo "selecting $XCODE_APP"
          sudo xcode-select -s "$XCODE_APP"
          xcodebuild -version

      - name: Import distribution certificate
        env:
          CERT_BASE64: ${{ secrets.DIST_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: |
          CERT_PATH="$RUNNER_TEMP/dist.p12"
          printf '%s' "$CERT_BASE64" | openssl base64 -d -A -out "$CERT_PATH"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 16)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db

      - name: Install provisioning profile
        env:
          PROFILE_BASE64: ${{ secrets.PROVISION_PROFILE_BASE64 }}
        run: |
          PP_PATH="$RUNNER_TEMP/profile.mobileprovision"
          printf '%s' "$PROFILE_BASE64" | openssl base64 -d -A -out "$PP_PATH"
          echo "profile size: $(wc -c < "$PP_PATH") bytes"
          PP_DIR="$HOME/Library/MobileDevice/Provisioning Profiles"
          mkdir -p "$PP_DIR"
          cp "$PP_PATH" "$PP_DIR/"
          # Informational only - signing resolves via -allowProvisioningUpdates.
          UUID="$(grep -aA1 '<key>UUID</key>' "$PP_PATH" | grep -o '<string>[A-Fa-f0-9-]*</string>' | head -1 | sed 's/<[^>]*>//g' || true)"
          echo "profile UUID (raw scan): ${UUID:-<not found>}"

      - name: Write App Store Connect API key
        env:
          P8_BASE64: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          printf '%s' "$P8_BASE64" | openssl base64 -d -A -out "$RUNNER_TEMP/AuthKey.p8"

      - name: Sanity-check ASC secret shapes (values never printed)
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          echo "ASC_KEY_ID length: ${#ASC_KEY_ID} (expected 10, like 6JBG26P3NC)"
          echo "ASC_ISSUER_ID length: ${#ASC_ISSUER_ID} (expected 36, a UUID)"
          if [[ "$ASC_ISSUER_ID" =~ ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$ ]]; then
            echo "ASC_ISSUER_ID is UUID-shaped: yes"
          else
            echo "ASC_ISSUER_ID is UUID-shaped: NO - this is the 401 suspect"
          fi
          echo "APPLE_TEAM_ID length: ${#APPLE_TEAM_ID} (expected 10)"
          head -c 40 "$RUNNER_TEMP/AuthKey.p8" | grep -q "BEGIN PRIVATE KEY" && echo "AuthKey.p8 starts with a PEM header: yes" || echo "AuthKey.p8 starts with a PEM header: NO - ASC_API_KEY_P8 is corrupt"

      - name: Write ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # Xcode 26 renamed the App Store export method from app-store to
          # app-store-connect; pick the name the selected Xcode understands.
          XCODE_MAJOR="$(xcodebuild -version | awk 'NR==1{print $2}' | cut -d. -f1)"
          if [ "$XCODE_MAJOR" -ge 26 ]; then
            METHOD="app-store-connect"
          else
            METHOD="app-store"
          fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>$METHOD</string>
            <key>teamID</key>
            <string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.deputyfife.opencode</key>
              <string>FifeCode</string>
            </dict>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          EOF
          cat "$RUNNER_TEMP/ExportOptions.plist"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          MARKETING_VERSION: ${{ inputs.marketing_version }}
        run: |
          # Manual signing WITHOUT a forced specifier: the app target
          # auto-selects the installed FifeCode profile (identity + bundle id
          # match), and package targets sign with the bare identity - they
          # reject explicitly specified profiles, but auto-selection skips
          # them (they need no profile). No -allowProvisioningUpdates here:
          # it would steer the archive at a development profile, and this
          # team has no registered devices.
          xcodebuild archive \
            -project OpenCodeClient/OpenCodeClient.xcodeproj \
            -scheme OpenCodeClient \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/FifeCode.xcarchive" \
            -derivedDataPath .occlient/DerivedData \
            -quiet \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            MARKETING_VERSION="${MARKETING_VERSION:-1.0}" \
            CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER"

      - name: Export and upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/FifeCode.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -destination 'upload' \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs-${{ github.run_id }}
          path: .occlient/DerivedData/Logs
          retention-days: 7
          if-no-files-found: ignore
